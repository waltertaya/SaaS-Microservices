version: '3.9'

services:
  # Postgres for Auth Service
  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Postgres for Billing Service
  billing-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing_db
    ports:
      - "5434:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
      - ./billing-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Auth Service
  auth-service:
    build: ./auth-service
    ports:
      - "8080:8080"
    depends_on:
      - auth-db
    environment:
      - DB_HOST=auth-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=auth_db

  # Billing Service
  billing-service:
    build: ./billing-service
    ports:
      - "8081:8081"
    depends_on:
      - billing-db
    environment:
      - DB_HOST=billing-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=billing_db

# API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "8088:8088"
    depends_on:
      - auth-service
      - billing-service

volumes:
  auth-db-data:
  billing-db-data:
